<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Dulce Herencia - Carrito</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background: #fef5e7; }
        h1 { color: #8b4513; text-align: center; }
        .productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin: 30px 0; }
        .producto { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .producto h3 { margin: 0 0 10px 0; color: #5a2d0c; }
        .precio { font-size: 18px; color: #28a745; font-weight: bold; margin-bottom: 10px; }
        button { background: #8b4513; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 15px; }
        button:hover { background: #a0522d; }
        .carrito { margin-top: 40px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .carrito h2 { color: #8b4513; border-bottom: 2px solid #f0e6d6; padding-bottom: 10px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .total { font-size: 22px; font-weight: bold; text-align: right; margin-top: 20px; color: #28a745; }
        .cantidad { width: 50px; text-align: center; border: 1px solid #ddd; border-radius: 4px; padding: 5px; }
        .eliminar { background: #dc3545; padding: 5px 10px; width: auto; font-size: 13px; }
    </style>
</head>
<body>

    <h1>🍫 Dulce Herencia - Tienda</h1>

    <h2>Productos Disponibles</h2>
    <div class="productos">
        <div class="producto">
            <h3>Chocolate</h3>
            <div class="precio">$5.50</div>
            <button onclick="agregarAlCarrito('Chocolate', 5.50)">Agregar al carrito</button>
        </div>
        <div class="producto">
            <h3>Torta</h3>
            <div class="precio">$25.00</div>
            <button onclick="agregarAlCarrito('Torta', 25.00)">Agregar al carrito</button>
        </div>
        <div class="producto">
            <h3>Galletas</h3>
            <div class="precio">$8.50</div>
            <button onclick="agregarAlCarrito('Galletas', 8.50)">Agregar al carrito</button>
        </div>
        <div class="producto">
            <h3>Pan de Dulce</h3>
            <div class="precio">$3.00</div>
            <button onclick="agregarAlCarrito('Pan de Dulce', 3.00)">Agregar al carrito</button>
        </div>
    </div>

    <div class="carrito">
        <h2>🛒 Tu Carrito</h2>
        <div id="lista-carrito"></div>
        <div class="total">Total: $<span id="total">0.00</span></div>
        <br>
        <button onclick="vaciarCarrito()" style="background: #dc3545;">Vaciar Carrito</button>
        <button onclick="generarPedido()" style="background: #28a745; margin-top: 10px;">✅ Guardar Pedido</button>
    </div>

<script>
let carrito = [];

function agregarAlCarrito(nombre, precio) {
    const existe = carrito.find(p => p.nombre === nombre);
    if (existe) {
        existe.cantidad++;
    } else {
        carrito.push({ nombre, precio, cantidad: 1 });
    }
    actualizarCarrito();
}

function quitarDelCarrito(nombre) {
    carrito = carrito.filter(p => p.nombre !== nombre);
    actualizarCarrito();
}

function cambiarCantidad(nombre, cant) {
    const producto = carrito.find(p => p.nombre === nombre);
    if (producto) {
        producto.cantidad = parseInt(cant);
        if (producto.cantidad <= 0) quitarDelCarrito(nombre);
        else actualizarCarrito();
    }
}

function actualizarCarrito() {
    const lista = document.getElementById('lista-carrito');
    const totalElement = document.getElementById('total');
    let total = 0;
    lista.innerHTML = '';

    carrito.forEach(producto => {
        const subtotal = producto.precio * producto.cantidad;
        total += subtotal;
        lista.innerHTML += `
            <div class="item">
                <div><strong>${producto.nombre}</strong> - $${producto.precio.toFixed(2)}</div>
                <div>
                    <input type="number" class="cantidad" value="${producto.cantidad}" min="1" 
                        onchange="cambiarCantidad('${producto.nombre}', this.value)">
                    <button class="eliminar" onclick="quitarDelCarrito('${producto.nombre}')">✕</button>
                    $${subtotal.toFixed(2)}
                </div>
            </div>
        `;
    });

    totalElement.textContent = total.toFixed(2);
}

function vaciarCarrito() {
    carrito = [];
    actualizarCarrito();
}

function generarPedido() {
    if (carrito.length === 0) {
        alert('⚠️ El carrito está vacío');
        return;
    }
    const total = carrito.reduce((sum, p) => sum + (p.precio * p.cantidad), 0);
    let texto = '📋 PEDIDO:\n\n';
    carrito.forEach(p => {
        texto += `${p.nombre} × ${p.cantidad} = $${(p.precio * p.cantidad).toFixed(2)}\n`;
    });
    texto += `\n💰 TOTAL: $${total.toFixed(2)}`;
    texto += '\n\n✅ Copia estos datos y pégalos en tu tabla order_items en Supabase';
    alert(texto);
    console.log(texto);
}
</script>
</body>
</html>
